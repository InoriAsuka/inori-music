# syntax=docker/dockerfile:1
# docker-compose.prod.yml — production stack
#
# Environment variables (set in .env):
#   INORI_ADMIN_TOKEN        — static bootstrap admin token
#   INORI_STREAM_SIGNING_KEY — HMAC key for signed streaming URLs
#   MEILI_SEARCH_KEY         — Meilisearch master key, shared as-is by the
#                              meilisearch service (MEILI_MASTER_KEY) and
#                              the api service's Meilisearch client
#   POSTGRES_PASSWORD        — PostgreSQL password

name: inori-music

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: inori
      POSTGRES_USER: inori
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inori"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Go REST API ─────────────────────────────────────────────────────────
  api:
    image: ghcr.io/inoriasuka/inori-music/api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      INORI_HTTP_ADDR: "0.0.0.0:8080"
      INORI_DATABASE_URL: "postgres://inori:${POSTGRES_PASSWORD}@postgres:5432/inori?sslmode=disable"
      INORI_ADMIN_TOKEN: "${INORI_ADMIN_TOKEN:?INORI_ADMIN_TOKEN required}"
      INORI_STREAM_SIGNING_KEY: "${INORI_STREAM_SIGNING_KEY:?INORI_STREAM_SIGNING_KEY required}"
      INORI_STORAGE_REPOSITORY_FILE: "/data/storage-backends.json"
      INORI_MEDIA_OBJECT_REPOSITORY_FILE: "/data/media-objects.json"
      # Optional — bootstraps the first admin account on a brand-new database
      # (no-op, not an error, when either is unset or an admin already
      # exists). Leave unset to provision the first admin directly in
      # Postgres instead; set both in .env for self-service first login.
      INORI_INITIAL_ADMIN_USER: "${INORI_INITIAL_ADMIN_USER:-}"
      INORI_INITIAL_ADMIN_PASSWORD: "${INORI_INITIAL_ADMIN_PASSWORD:-}"
      # Optional — comma-separated browser origins allowed by CORS. Unset
      # means permissive mode (any origin reflected); set this to the
      # web/admin consoles' real public origin(s) once known.
      INORI_CORS_ORIGINS: "${INORI_CORS_ORIGINS:-}"
      # Optional — session lifetime (Go duration syntax). "24h" mirrors the
      # server's own built-in default; override in .env to change it.
      INORI_SESSION_TTL: "${INORI_SESSION_TTL:-24h}"
      # Optional — periodic storage-backend health/capacity refresh interval
      # (Go duration syntax, e.g. "15m"). Unset disables the scheduler
      # (server default); set in .env to enable it.
      INORI_STORAGE_REFRESH_INTERVAL: "${INORI_STORAGE_REFRESH_INTERVAL:-}"
      # Meilisearch full-text search backend (see the "meilisearch" service
      # below). Without these two, catalog search silently falls back to
      # PostgreSQL full-text search with no log line at all — the
      # meilisearch container keeps running, just never queried. MEILI_HOST
      # points at the meilisearch service's in-network address (fixed, not
      # user-configurable, like INORI_DATABASE_URL's "postgres" hostname
      # above). MEILI_SEARCH_KEY must be the *exact same* value as the
      # meilisearch service's MEILI_MASTER_KEY below: the api service's
      # Meilisearch client creates/configures indexes on startup, which
      # needs admin-level permissions that a dedicated search-only
      # Meilisearch API key does not have — reusing the master key here is
      # required, not just convenient.
      MEILI_HOST: "http://meilisearch:7700"
      MEILI_SEARCH_KEY: "${MEILI_SEARCH_KEY:?MEILI_SEARCH_KEY required}"
    volumes:
      - api_data:/data
      # Mount media directories for local/NFS backends (read-only)
      # - /mnt/music:/mnt/music:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ── Web player (Next.js, :3000) ─────────────────────────────────────────
  web:
    image: ghcr.io/inoriasuka/inori-music/web:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: "http://api:8080"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ── Admin console (Next.js, :3001) ──────────────────────────────────────
  admin:
    image: ghcr.io/inoriasuka/inori-music/admin:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: "http://api:8080"
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/admin/login"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ── Meilisearch (:7700) ─────────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:latest
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILI_SEARCH_KEY:?MEILI_SEARCH_KEY required}
      - MEILI_ENV=production
    volumes:
      - meilisearch_data:/meili_data
    restart: unless-stopped

  # ── Nginx gateway (:80) ─────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      web:
        condition: service_healthy
      admin:
        condition: service_healthy
      api:
        condition: service_healthy
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      # TLS certificates — mount from host or use certbot sidecar
      # - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  postgres_data:
  api_data:
  meilisearch_data:
